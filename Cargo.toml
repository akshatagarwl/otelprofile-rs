[package]
name = "otelprofile"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Continuous in-process profiling for Rust that pushes standard OTLP Profiles"
license = "Apache-2.0"
repository = "https://github.com/akshatagarwl/otelprofile-rs"
readme = "README.md"
keywords = ["profiling", "opentelemetry", "otlp", "pprof", "jemalloc"]
categories = ["development-tools::profiling"]
exclude = ["/.github", "/docs/assets/src", "/evidence"]

[workspace]
members = ["examples/demo"]

[dependencies]
backtrace = "0.3.77"
findshlibs = "0.10"
libc = "0.2"
flate2 = "1"
httpdate = "1"
log = "0.4"
opentelemetry = { version = "0.33", default-features = false, features = ["trace", "experimental_context_observer"], optional = true }
pin-project-lite = "0.2"
prost = "0.14"
ureq = { version = "3.5", default-features = false, features = ["rustls"] }

[features]
# Link CPU samples to the active OpenTelemetry span.
opentelemetry = ["dep:opentelemetry"]

[dev-dependencies]
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"] }
tracing = "0.1"
tracing-opentelemetry = "0.34"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
tiny_http = "0.12"
opentelemetry-proto = { version = "0.33.1", default-features = false, features = ["gen-tonic-messages", "profiles"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
