[package]
name = "otelprofile-soak"
version = "0.0.0"
edition = "2024"
publish = false

[features]
default = ["jemalloc"]
jemalloc = ["otelprofile/jemalloc", "dep:tikv-jemallocator", "dep:tikv-jemalloc-ctl"]
sampled = []

[[example]]
name = "dump-cost"
path = "dump-cost.rs"
required-features = ["jemalloc"]

[dependencies]
otelprofile = { path = "../.." }
pyroscope = { version = "=2.1.5", default-features = false, features = ["backend-pprof-rs", "backend-jemalloc"] }
tikv-jemallocator = { version = "0.7", features = ["profiling"], optional = true }
tikv-jemalloc-ctl = { version = "0.7", features = ["profiling"], optional = true }
libc = "0.2"
serde_json = "1"
env_logger = "0.11"
