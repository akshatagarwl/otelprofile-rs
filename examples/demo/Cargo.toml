[package]
name = "otelprofile-demo"
version = "0.0.0"
edition = "2024"
publish = false
description = "A small checkout service that sends traces and profiles, for trying receivers."

[features]
# Heap profiles from jemalloc instead of the Sampled wrapper.
jemalloc = ["otelprofile/jemalloc", "dep:tikv-jemallocator"]

[dependencies]
otelprofile = { path = "../..", features = ["opentelemetry"] }
opentelemetry = "0.33"
opentelemetry_sdk = "0.33"
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client"] }
tikv-jemallocator = { version = "0.7", features = ["profiling"], optional = true }
tracing = "0.1"
tracing-opentelemetry = "0.34"
tracing-subscriber = "0.3"
