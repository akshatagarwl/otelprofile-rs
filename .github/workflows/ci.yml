name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features
      - run: cargo test --workspace

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo package --locked --all-features

  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: docs/assets/src
      - run: npm run generate && node --check screenshots.mjs && node --check check-readme.mjs
        working-directory: docs/assets/src
      - run: git diff --exit-code -- docs/assets

  cpu-timer-probe:
    strategy:
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: compare raw kernel timer delivery without native unwinding
        run: |
          sysctl kern.clockrate
          cc -O2 -std=c11 -Wall -Wextra -Werror -pthread scripts/cpu-timer-probe.c -o /tmp/cpu-timer-probe
          for hz in 40 60 100 200; do /tmp/cpu-timer-probe "$hz"; done

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features

  conformance:
    name: profcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.x"
          cache: false
      - name: install profcheck
        run: go install github.com/open-telemetry/sig-profiling/profcheck/cmd/profcheck@668bf42ffd459941cbd1fc1977c63384eaeaa73a
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: every encoded request passes profcheck
        env:
          OTELPROFILE_REQUIRE_PROFCHECK: "1"
        run: cargo test --all-features profcheck
